<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Rekap Jemputan Ojeg Realtime</title>

    <!-- Import Firebase SDK (v9/v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; color: #333; padding: 10px; min-height: 100vh; display: flex; flex-direction: column; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; flex: 1; display: flex; flex-direction: column; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 10px; font-size: 1.3em; }

        .status-badge { text-align: center; font-size: 0.8em; padding: 4px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; background: #fff3cd; color: #856404; }
        .status-online { background: #d4edda; color: #155724; }

        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 10px; }
        .tab-button { flex: 1; padding: 8px; text-align: center; background: #eee; border: none; outline: none; cursor: pointer; font-weight: bold; color: #555; border-radius: 6px 6px 0 0; font-size: 0.9em; }
        .tab-button.active { background: #3498db; color: white; }
        .tab-content { display: none; flex-direction: column; }
        .tab-content.active { display: flex; }

        .config-panel { background-color: #e8f4fd; border: 1px solid #b6e0fe; padding: 10px; border-radius: 6px; margin-bottom: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; font-size: 0.85em; }
        .config-group { display: flex; align-items: center; gap: 5px; }
        .config-group label { font-weight: bold; white-space: nowrap; }
        .config-group input { width: 100%; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9em; }

        .table-container { max-height: 380px; overflow: auto; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85em; white-space: nowrap; }
        th, td { border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 4px 8px; text-align: center; vertical-align: middle; background-color: #fff; }
        th { background-color: #3498db; color: white; position: sticky; top: 0; z-index: 10; padding: 6px 8px; border-top: 1px solid #ddd; }
        tr:nth-child(even) td { background-color: #f9f9f9; }

        .freeze-col { position: sticky; left: 0; z-index: 5; background-color: #f1f7fc !important; font-weight: bold; border-right: 2px solid #3498db !important; }
        th.freeze-col { z-index: 15; background-color: #2980b9 !important; }

        tr.hari-minggu td { background-color: #ffe6e6 !important; color: #d63031; border-color: #ffcccc; }
        tr.hari-minggu td.freeze-col { background-color: #ffd8d8 !important; color: #d63031; }

        input[type="checkbox"] { transform: scale(1.1); cursor: pointer; vertical-align: middle; }
        .chk-label { margin: 0 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
        .input-ket { width: 100%; padding: 3px 5px; border: 1px solid #ccc; border-radius: 3px; font-size: 0.85em; }

        .total-box { background-color: #2ecc71; color: white; padding: 10px; text-align: center; font-size: 1.1em; font-weight: bold; border-radius: 6px; }
        .status-lunas { color: #27ae60; font-weight: bold; }
        .status-pending { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Catatan Jemputan Ojeg</h2>
    <div id="conn-status" class="status-badge">Menghubungkan ke Database...</div>
    
    <div class="tabs">
        <button class="tab-button active" onclick="openTab('tab-harian', this)">Catatan Bulan Ini</button>
        <button class="tab-button" onclick="openTab('tab-riwayat', this)">Riwayat Pembayaran</button>
    </div>

    <!-- Tab 1: Catatan Harian -->
    <div id="tab-harian" class="tab-content active">
        <div class="config-panel">
            <div class="config-group">
                <label>Siswa 1:</label>
                <input type="text" id="nama-a" value="Siswa A" onchange="simpanKonfigurasi()" placeholder="Nama A">
                <input type="number" id="tarif-a" value="5000" onchange="simpanKonfigurasi()" placeholder="Tarif A">
            </div>
            <div class="config-group">
                <label>Siswa 2:</label>
                <input type="text" id="nama-b" value="Siswa B" onchange="simpanKonfigurasi()" placeholder="Nama B">
                <input type="number" id="tarif-b" value="12000" onchange="simpanKonfigurasi()" placeholder="Tarif B">
            </div>
        </div>

        <div style="text-align:center; font-weight:bold; color:#7f8c8d; margin-bottom:8px; font-size: 0.9em;" id="nama-bulan"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="freeze-col" style="width: 12%;">Tgl</th>
                        <th style="width: 12%;">Hari</th>
                        <th style="width: 30%;">Siswa Masuk</th>
                        <th style="width: 18%;">Subtotal</th>
                        <th>Keterangan</th>
                    </tr>
                </thead>
                <tbody id="tabel-body"></tbody>
            </table>
        </div>

        <div class="total-box">
            Total Tagihan: Rp <span id="total-harga">0</span>
        </div>
    </div>

    <!-- Tab 2: Riwayat Pembayaran -->
    <div id="tab-riwayat" class="tab-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Periode</th>
                        <th>Total Tagihan</th>
                        <th>Status</th>
                        <th>Sudah Dibayar?</th>
                    </tr>
                </thead>
                <tbody id="tabel-riwayat-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // PASTE KONFIGURASI FIREBASE ANDA DI SINI
    // -------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyCZg8n_xutoukbDq0infkgKeceG6-rxhJE",
        authDomain: "abudemen-aa.firebaseapp.com",
        databaseURL: "https://abudemen-aa-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "abudemen-aa",
        storageBucket: "abudemen-aa.firebasestorage.app",
        messagingSenderId: "773709057684",
        appId: "1:773709057684:web:14d40249d27eea123b2e81"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Indikator Status Koneksi Realtime
    db.ref('.info/connected').on('value', (snap) => {
        const badge = document.getElementById('conn-status');
        if (snap.val() === true) {
            badge.innerText = "⚡ Realtime Terhubung";
            badge.classList.add('status-online');
        } else {
            badge.innerText = "Terputus / Menghubungkan...";
            badge.classList.remove('status-online');
        }
    });

    const namaHari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

    const skrg = new Date();
    const tahun = skrg.getFullYear();
    const bulan = skrg.getMonth();
    const pathBulanIni = `data_${tahun}_${bulan}`;

    document.getElementById('nama-bulan').innerText = `Bulan: ${namaBulan[bulan]} ${tahun}`;

    // Render Baris Tabel Harian
    const jumlahHari = new Date(tahun, bulan + 1, 0).getDate();
    const tbody = document.getElementById('tabel-body');

    for (let i = 1; i <= jumlahHari; i++) {
        const objTanggal = new Date(tahun, bulan, i);
        const dayOfWeek = objTanggal.getDay();
        const hari = namaHari[dayOfWeek];
        const isHariMinggu = (dayOfWeek === 0);
        
        const tr = document.createElement('tr');
        if (isHariMinggu) tr.classList.add('hari-minggu');

        tr.innerHTML = `
            <td class="freeze-col">${i} ${namaBulan[bulan].substring(0,3)}</td>
            <td>${hari}</td>
            <td>
                ${isHariMinggu 
                    ? '<span style="color:#e74c3c;">-</span>' 
                    : `<label class="chk-label"><input type="checkbox" id="chk-a-${i}" class="chk-a" onchange="kirimDataHari(${i})"><span class="lbl-a">A</span></label>
                       <label class="chk-label"><input type="checkbox" id="chk-b-${i}" class="chk-b" onchange="kirimDataHari(${i})"><span class="lbl-b">B</span></label>`
                }
            </td>
            <td>
                ${isHariMinggu 
                    ? '<span style="color:#e74c3c;">-</span>' 
                    : 'Rp <span id="subtotal-${i}" class="subtotal-hari">0</span>'
                }
            </td>
            <td>
                <input type="text" id="ket-${i}" class="input-ket" onchange="kirimDataHari(${i})" placeholder="${isHariMinggu ? 'Libur' : 'Catatan'}">
            </td>
        `;
        tbody.appendChild(tr);
    }

    // --- FUNGSI HITUNG TOTAL & SUBTOTAL (DIPERBAIKI) ---
    function hitungTotalLokal() {
        const tarifA = parseInt(document.getElementById('tarif-a').value) || 0;
        const tarifB = parseInt(document.getElementById('tarif-b').value) || 0;

        let grandTotal = 0;

        for (let i = 1; i <= jumlahHari; i++) {
            const chkA = document.getElementById(`chk-a-${i}`);
            const chkB = document.getElementById(`chk-b-${i}`);
            const subtotalSpan = document.getElementById(`subtotal-${i}`);

            if (chkA && chkB && subtotalSpan) {
                let harian = 0;
                if (chkA.checked) harian += tarifA;
                if (chkB.checked) harian += tarifB;

                subtotalSpan.innerText = harian.toLocaleString('id-ID');
                grandTotal += harian;
            }
        }

        document.getElementById('total-harga').innerText = grandTotal.toLocaleString('id-ID');
        updateRiwayatBulanIni(grandTotal);
    }

    // Simpan Pengaturan Nama & Tarif ke Firebase
    function simpanKonfigurasi() {
        const configData = {
            namaA: document.getElementById('nama-a').value || 'A',
            tarifA: parseInt(document.getElementById('tarif-a').value) || 0,
            namaB: document.getElementById('nama-b').value || 'B',
            tarifB: parseInt(document.getElementById('tarif-b').value) || 0
        };
        db.ref('config').set(configData);
    }

    // Kirim Data Centangan/Keterangan Harian ke Firebase saat diubah
    function kirimDataHari(tgl) {
        const chkA = document.getElementById(`chk-a-${tgl}`);
        const chkB = document.getElementById(`chk-b-${tgl}`);
        const ket = document.getElementById(`ket-${tgl}`);

        if (chkA && chkB) {
            db.ref(`${pathBulanIni}/tgl_${tgl}`).set({
                a: chkA.checked,
                b: chkB.checked,
                ket: ket.value || ''
            });
        }
    }

    // Listen Pengaturan (Nama & Tarif) dari Firebase
    db.ref('config').on('value', (snap) => {
        const val = snap.val();
        if (val) {
            document.getElementById('nama-a').value = val.namaA;
            document.getElementById('tarif-a').value = val.tarifA;
            document.getElementById('nama-b').value = val.namaB;
            document.getElementById('tarif-b').value = val.tarifB;

            document.querySelectorAll('.lbl-a').forEach(el => el.innerText = val.namaA);
            document.querySelectorAll('.lbl-b').forEach(el => el.innerText = val.namaB);
            
            hitungTotalLokal();
        }
    });

    // Listen Data Absensi Harian dari Firebase
    db.ref(pathBulanIni).on('value', (snap) => {
        const dataBulan = snap.val() || {};
        for (let i = 1; i <= jumlahHari; i++) {
            const dataTgl = dataBulan[`tgl_${i}`];
            const chkA = document.getElementById(`chk-a-${i}`);
            const chkB = document.getElementById(`chk-b-${i}`);
            const ket = document.getElementById(`ket-${i}`);

            if (chkA && chkB) {
                chkA.checked = dataTgl ? (dataTgl.a || false) : false;
                chkB.checked = dataTgl ? (dataTgl.b || false) : false;
                if (ket) ket.value = dataTgl ? (dataTgl.ket || '') : '';
            }
        }
        
        // Jalankan kalkulasi subtotal setelah centangan di-update
        hitungTotalLokal();
    });

    // Navigasi Tab
    function openTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // Init Tab Riwayat
    function initRiwayat() {
        const tbodyRiwayat = document.getElementById('tabel-riwayat-body');
        tbodyRiwayat.innerHTML = '';

        for (let i = 2; i >= 0; i--) {
            let tempDate = new Date(tahun, bulan - i, 1);
            let bName = namaBulan[tempDate.getMonth()];
            let tYear = tempDate.getFullYear();
            let keyPath = `lunas_${tYear}_${tempDate.getMonth()}`;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${bName} ${tYear}</strong></td>
                <td><span id="tagihan-riwayat-${i}">${i === 0 ? 'Rp 0' : 'Rp -'}</span></td>
                <td><span id="status-text-${i}" class="status-pending">BELUM DIBAYAR</span></td>
                <td>
                    <input type="checkbox" id="chk-lunas-${i}" onchange="toggleLunas(${i}, '${keyPath}')">
                </td>
            `;
            tbodyRiwayat.appendChild(tr);

            db.ref(`riwayat/${keyPath}`).on('value', (snap) => {
                const isLunas = snap.val() === true;
                const chk = document.getElementById(`chk-lunas-${i}`);
                const statusText = document.getElementById(`status-text-${i}`);
                if (chk && statusText) {
                    chk.checked = isLunas;
                    statusText.innerText = isLunas ? 'LUNAS' : 'BELUM DIBAYAR';
                    statusText.className = isLunas ? 'status-lunas' : 'status-pending';
                }
            });
        }
    }

    function updateRiwayatBulanIni(total) {
        const tagihanSpan = document.getElementById('tagihan-riwayat-0');
        if (tagihanSpan) {
            tagihanSpan.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }
    }

    function toggleLunas(index, keyPath) {
        const chk = document.getElementById(`chk-lunas-${index}`);
        db.ref(`riwayat/${keyPath}`).set(chk.checked);
    }

    // Inisialisasi
    initRiwayat();
    hitungTotalLokal();
</script>

</body>
</html>
