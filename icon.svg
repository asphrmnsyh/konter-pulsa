<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with Safe Padding -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  
  <!-- Smartphone Frame Center -->
  <rect x="136" y="76" width="240" height="360" rx="32" fill="#1e293b" stroke="#334155" stroke-width="8" />
  
  <!-- Screen Area -->
  <rect x="156" y="116" width="200" height="260" rx="16" fill="url(#primaryGrad)" />
  
  <!-- Speaker notch -->
  <rect x="220" y="94" width="72" height="8" rx="4" fill="#475569" />
  
  <!-- Home Indicator -->
  <rect x="216" y="400" width="80" height="8" rx="4" fill="#475569" />
  
  <!-- Lightning Bolt (Pulsa / Listrik / Speed) -->
  <path d="M266 146 L216 246 L254 246 L244 326 L298 226 L260 226 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
  
  <!-- Signal Waves -->
  <path d="M180 180 A 40 40 0 0 1 200 156" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M170 196 A 65 65 0 0 1 205 135" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5" />
  
  <!-- Receipt / Struk Graphic bottom corner -->
  <g transform="translate(290, 270)">
    <rect width="130" height="150" rx="12" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.3))" />
    <rect x="15" y="20" width="100" height="8" rx="4" fill="#94a3b8" />
    <rect x="15" y="38" width="75" height="6" rx="3" fill="#cbd5e1" />
    <rect x="15" y="52" width="90" height="6" rx="3" fill="#cbd5e1" />
    <line x1="15" y1="72" x2="115" y2="72" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,3" />
    <rect x="15" y="86" width="50" height="8" rx="3" fill="#0284c7" />
    <rect x="75" y="86" width="40" height="8" rx="3" fill="#10b981" />
    <!-- Jagged bottom edge -->
    <path d="M 0 150 L 15 140 L 30 150 L 45 140 L 60 150 L 75 140 L 90 150 L 105 140 L 120 150 L 130 142 L 130 0 L 0 0 Z" fill="#ffffff" />
  </g>
</svg>
